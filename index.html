};


const exerciseDescriptions={
"DB goblet squat — comfortable depth":"Hold one dumbbell at your chest. Sit down and back to a comfortable depth, keeping your knees tracking comfortably over your feet, then stand tall.",
"DB Romanian deadlift":"Hold dumbbells by your thighs. Hinge your hips back with a soft knee bend, keep your back neutral, lower until you feel your hamstrings load, then drive your hips forward.",
"DB bench press":"Lie on the bench with dumbbells over your chest. Lower with control toward your chest, then press back up without letting your shoulders shrug.",
"1-arm DB row, bench-supported / side":"Support yourself on the bench. Pull the dumbbell toward your hip while keeping your torso stable, then lower with control.",
"DB hip thrust on bench":"Rest your upper back on the bench and keep your feet planted. Drive through your feet to lift your hips, squeeze your glutes at the top, then lower.",
"DB lateral raise":"With light dumbbells at your sides, raise your arms out to about shoulder height with a soft elbow bend, then lower slowly.",
"Dead bug / side":"Lie on your back with arms up and knees bent. Brace your core and slowly extend the opposite arm and leg without letting your lower back arch.",
"Low step-up / side*":"Step onto a low, stable step and drive through the working foot to stand. Lower slowly and stay controlled. If this bothers your knee, use a pain-free squat variation.",
"Seated DB shoulder press":"Sit tall with dumbbells at shoulder height. Press overhead while keeping your ribs controlled, then lower slowly.",
"Chest-supported DB row":"Lie chest-down on an inclined bench with dumbbells hanging down. Pull toward your ribs or hips while keeping your chest supported, then lower slowly.",
"DB glute bridge":"Lie on your back with feet planted and the dumbbell resting securely over your hips. Lift your hips by squeezing your glutes, pause briefly, then lower.",
"DB biceps curl":"Keep your elbows close to your sides. Curl the dumbbells toward your shoulders without swinging, then lower slowly.",
"Side plank / side":"Support yourself on one forearm and the side of your foot or knees. Keep your body in a straight line and brace your core.",
"DB squat — comfortable depth":"Hold dumbbells securely and squat to a comfortable, pain-free depth. Keep your torso controlled and knees tracking comfortably over your feet.",
"Single-leg DB RDL / side":"Balance on one leg while hinging your hips back and reaching the other leg behind you. Keep your hips square and return to standing with control.",
"Incline DB bench press":"Lie on an inclined bench with dumbbells over your chest. Lower with control, then press up while keeping your shoulders stable.",
"DB pullover":"Lie on the bench holding one dumbbell over your chest. With slightly bent elbows, lower it behind your head only as far as comfortable, then bring it back over your chest.",
"DB overhead triceps extension":"Hold one dumbbell overhead with both hands. Bend your elbows to lower it behind your head, then extend your elbows to return it overhead.",
"Suitcase hold / side":"Hold one dumbbell at your side while standing tall. Brace your core and resist leaning toward the weight. Switch sides."
};

function initAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(C){if(!audioCtx)audioCtx=new C();if(audioCtx.state==='suspended')audioCtx.resume();}if(!alarmAudio){alarmAudio=document.getElementById('alarmAudio');alarmAudio.src=alarmWav;alarmAudio.load();}if(alarmAudio){const p=alarmAudio.play();if(p)p.then(()=>{alarmAudio.pause();alarmAudio.currentTime=0}).catch(()=>{});}}catch(e){}}
function exportBackup(){const payload={app:'Andrea Workout Tracker',version:5,exportedAt:new Date().toISOString(),data};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='andrea-workout-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importBackup(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result);const incoming=p.data||p;if(!incoming||!Array.isArray(incoming.logs))throw new Error('Invalid backup');if(!confirm('Replace the current workout history with this backup?'))return;data=incoming;if(!data.week)data.week=1;if(!data.day)data.day='A';save();render();alert('Backup restored.');}catch(e){alert('That file does not look like an Andrea Workout Tracker backup.')}};r.readAsText(file)}
function lastFor(ex){let rows=data.logs.filter(x=>x.exercise===ex&&x.weight!==''&&x.weight!=null);return rows.length?rows[rows.length-1]:null}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));document.getElementById('main').innerHTML=activeTab==='workout'?workoutView():activeTab==='stats'?statsView():historyView()}
function cardioSummary(type){return data.logs.filter(x=>x.type===type).sort((a,b)=>new Date(b.date)-new Date(a.date))[0]}
function logCardio(type){const id=type==='HIIT'?'hiit-min':'z2-min';const mins=Number(document.getElementById(id)?.value||0);if(!mins){alert('Enter the minutes first.');return}data.logs.push({date:new Date().toISOString(),type,minutes:mins,week:data.week});save();render();}
function cardioView(){let h=cardioSummary('HIIT'),z=cardioSummary('Zone 2');return `<div class="section-title">Weekly cardio</div><div class="card"><div class="small">Tuesday • Zone 2: 30–40 min conversational pace (RPE 4–5). Thursday • HIIT: 5 min warm-up → 6 × (45–60 sec brisk uphill + 90 sec easy) → 5 min cool-down.</div><div class="cardio-grid" style="margin-top:12px"><div class="cardio-card"><h3>HIIT</h3><div class="small">Short • low-impact intervals</div><input id="hiit-min" inputmode="numeric" placeholder="Minutes"><button class="primary" style="width:100%" onclick="logCardio('HIIT')">Log HIIT</button>${h?`<div class="cardio-done">Last: ${h.minutes} min • ${new Date(h.date).toLocaleDateString()}</div>`:''}</div><div class="cardio-card"><h3>Zone 2</h3><div class="small">30–45 min • easy/moderate</div><input id="z2-min" inputmode="numeric" placeholder="Minutes"><button class="primary" style="width:100%" onclick="logCardio('Zone 2')">Log Zone 2</button>${z?`<div class="cardio-done">Last: ${z.minutes} min • ${new Date(z.date).toLocaleDateString()}</div>`:''}</div></div></div>`}
function weekDone(kind){
  if(kind==='A'||kind==='B'||kind==='C'){
    return data.logs.some(x=>x.type==='workout'&&Number(x.week)===Number(data.week)&&x.day===kind);
  }
  const type=kind==='Z2'?'Zone 2':'HIIT';
  return data.logs.some(x=>x.type===type&&Number(x.week)===Number(data.week));
}
function weekNavigation(){
  const w=Number(data.week)||1;
  return `<div class="card week-nav">
    <div class="row">
      <button class="secondary" onclick="changeWeek(${Math.max(1,w-1)})" ${w===1?'disabled':''}>‹</button>
      <div style="text-align:center"><div class="tiny">8-WEEK PLAN</div><div class="workout-title">Week ${w} of 8</div></div>
      <button class="secondary" onclick="changeWeek(${Math.min(8,w+1)})" ${w===8?'disabled':''}>›</button>
    </div>
    <select style="width:100%;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff" onchange="changeWeek(Number(this.value))">
      ${Array.from({length:8},(_,i)=>`<option value="${i+1}" ${i+1===w?'selected':''}>Week ${i+1}</option>`).join('')}
    </select>
    <div class="small" style="margin-top:10px">${weekFocus[w]}</div>
  </div>`;
}
function weeklyPlanView(){
  return `<div class="section-title">This week's plan</div><div class="card weekly-plan">
    ${weeklyPlan.map(([day,name,key])=>{
      const done=weekDone(key);
      const onclick=key==='A'||key==='B'||key==='C'?`onclick="data.day='${key}';save();render()"`:'';
      return `<button class="plan-item ${done?'done':''}" ${onclick}>
        <span class="plan-day">${day}</span><span class="plan-name">${name}</span><span class="plan-status">${done?'✓ Done':'○'}</span>
      </button>`;
    }).join('')}
  </div>`;
}
function changeWeek(n){
  n=Math.max(1,Math.min(8,Number(n)||1));
  data.week=n;
  save();
  render();
}

function showInfoByIndex(i){
  const ex=workouts[data.day]?.ex?.[Number(i)];
  const title=ex?ex[0]:'Exercise';
  const text=exerciseDescriptions[title]||'Short exercise instructions are not available for this movement yet.';
  document.getElementById('infoTitle').textContent=title;
  document.getElementById('infoText').textContent=text;
  document.getElementById('infoModal').classList.add('show');
}
function closeInfo(){document.getElementById('infoModal').classList.remove('show');}
function workoutView(){let w=workouts[data.day];return weekNavigation()+weeklyPlanView()+`<div class="card hero"><div class="row"><div><div class="tiny">Week ${data.week}</div><div class="workout-title">${w.name}</div></div><select id="daySelect" onchange="data.day=this.value;save();render()"><option value="A" ${data.day==='A'?'selected':''}>Monday • A</option><option value="B" ${data.day==='B'?'selected':''}>Wednesday • B</option><option value="C" ${data.day==='C'?'selected':''}>Friday • C</option></select></div><div style="margin-top:12px" class="small">PDF plan: 1–3 RIR • progress reps first, then load.</div></div>`+cardioView()+w.ex.map((e,i)=>{let last=lastFor(e[0]);return `<div class="card exercise"><h3>${e[0]}${exerciseDescriptions[e[0]]?`<button class="info-btn" aria-label="Exercise information" onclick="showInfoByIndex(${i})">i</button>`:''}</h3><div class="small">${e[1]} sets • ${e[2]} reps • ${e[3]}s rest • target ${e[4]} RIR</div>${last?`<div class="prev"><span class="arrow">↻</span><span>Last time: <b>${last.weight} lb</b> × ${last.reps} reps</span><span>• ${new Date(last.date).toLocaleDateString()}</span></div>`:'<div class="prev">No previous entry yet</div>'}<div class="fields"><label>Weight (lb)<input id="wt-${i}" inputmode="decimal" value="${last?.weight??''}"></label><label>Reps<input id="rp-${i}" inputmode="numeric" value="${last?.reps??''}"></label><label>RIR<input id="rir-${i}" inputmode="decimal" value="${last?.rir??e[4]}"></label></div><div class="row" style="margin-top:10px"><button class="primary" onclick="logSet(${i})">Log set</button><button class="secondary" onclick="startTimer(${e[3]})">${e[3]}s rest</button></div></div>`}).join('')+`<div class="card"><div class="row"><div><b>Finish workout</b><div class="small">Counts today toward your weekly and monthly statistics.</div></div><button class="primary" onclick="finishWorkout()">Finish</button></div></div>`}
function logSet(i){let e=workouts[data.day].ex[i],weight=document.getElementById('wt-'+i).value,reps=document.getElementById('rp-'+i).value,rir=document.getElementById('rir-'+i).value;if(!reps){alert('Enter reps first.');return}data.logs.push({date:new Date().toISOString(),week:data.week,day:data.day,exercise:e[0],weight,reps:Number(reps),rir:Number(rir),sets:1,muscles:e[5]});save();render();startTimer(e[3])}
function finishWorkout(){data.logs.push({date:new Date().toISOString(),week:data.week,day:data.day,type:'workout'});save();alert('Workout saved!')}
function scheduleAlarm(sec){try{if(!audioCtx)return;if(audioCtx.state==='suspended')audioCtx.resume();const start=audioCtx.currentTime+Math.max(0,sec-0.05);[880,660,880,660,880].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=start+i*.18;o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.32,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.20);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.22)});}catch(e){}}
function startTimer(sec){initAudio();if(timerId)clearInterval(timerId);timerId=null;localStorage.setItem(timerKey,JSON.stringify({endAt:Date.now()+sec*1000,total:sec}));scheduleAlarm(sec);renderTimer();timerId=setInterval(renderTimer,250)}
function stopTimer(keepHidden=false){if(timerId)clearInterval(timerId);timerId=null;if(!keepHidden)localStorage.removeItem(timerKey);const el=document.getElementById('timer');if(el)el.style.display='none'}
function acknowledgeTimer(){stopTimer(false)}
function renderTimer(){const raw=localStorage.getItem(timerKey),el=document.getElementById('timer'),t=document.getElementById('time');if(!raw){if(timerId)clearInterval(timerId);timerId=null;if(el)el.style.display='none';return}let obj;try{obj=JSON.parse(raw)}catch(e){localStorage.removeItem(timerKey);return}let left=Math.max(0,Math.ceil((obj.endAt-Date.now())/1000));if(left<=0){localStorage.removeItem(timerKey);if(timerId)clearInterval(timerId);timerId=null;if(el){el.style.display='block';el.classList.add('done');t.textContent='Done';document.getElementById('timerNote').textContent='Rest complete';document.getElementById('timerActions').innerHTML='<button onclick="acknowledgeTimer()">Next set / exercise</button>'}navigator.vibrate?.([180,80,180]);return}if(el){el.classList.remove('done');el.style.display='block';t.textContent=left;document.getElementById('timerNote').textContent='Timer keeps its place if you switch screens.';document.getElementById('timerActions').innerHTML='<button onclick="stopTimer()">×</button>'}}
function beep(){scheduleAlarm(0)}
function restoreTimer(){if(timerId)clearInterval(timerId);timerId=null;const raw=localStorage.getItem(timerKey);if(!raw)return;renderTimer();if(Date.now()<JSON.parse(raw).endAt)timerId=setInterval(renderTimer,250);else renderTimer()}
function allSetLogs(){return data.logs.filter(x=>x.exercise)}
function stats(){let sets=allSetLogs(),muscle={};sets.forEach(x=>x.muscles?.forEach(m=>muscle[m]=(muscle[m]||0)+1));return {sets,muscle,days:new Set(sets.map(x=>x.date.slice(0,10)))} }
function intensityFor(n,max){if(!n)return 0;let p=n/max;return p>.66?3:p>.33?2:1}
function bodyMap(muscle){let vals=['Shoulders','Chest','Back','Biceps','Triceps','Core','Glutes','Hamstrings','Quads'];let max=Math.max(1,...vals.map(v=>muscle[v]||0));let c=v=>{let n=muscle[v]||0;return n?`fill-opacity="${.18+.72*(n/max)}"`: 'fill-opacity=".08"'};return `<div class="bodymap"><svg viewBox="0 0 360 290" aria-label="Muscle heat map"><g stroke="#7f8793" stroke-width="2" fill="#b5bfd6"><circle cx="180" cy="35" r="22" ${c('Core')}/><path d="M153 62 Q180 50 207 62 L222 112 L207 157 L197 125 L197 205 L187 260 L180 205 L173 260 L163 205 L163 125 L153 157 L138 112 Z" ${c('Core')}/><path d="M154 68 L125 80 L112 128 L124 133 L143 102 Z" ${c('Shoulders')}/><path d="M206 68 L235 80 L248 128 L236 133 L217 102 Z" ${c('Shoulders')}/><path d="M144 74 Q180 61 216 74 L207 112 L180 122 L153 112 Z" ${c('Chest')}/><path d="M156 77 L177 72 L177 117 L153 111 Z" ${c('Back')}/><path d="M204 77 L183 72 L183 117 L207 111 Z" ${c('Back')}/><path d="M126 84 L110 123 L118 158 L130 155 L136 119 Z" ${c('Biceps')}/><path d="M234 84 L250 123 L242 158 L230 155 L224 119 Z" ${c('Triceps')}/><path d="M153 111 L180 121 L207 111 L201 151 L180 160 L159 151 Z" ${c('Core')}/><path d="M159 146 L177 157 L174 206 L157 206 Z" ${c('Glutes')}/><path d="M201 146 L183 157 L186 206 L203 206 Z" ${c('Glutes')}/><path d="M157 202 L174 202 L171 258 L154 258 Z" ${c('Quads')}/><path d="M203 202 L186 202 L189 258 L206 258 Z" ${c('Quads')}/><path d="M154 204 L171 204 L166 258 L151 258 Z" ${c('Hamstrings')}/><path d="M206 204 L189 204 L194 258 L209 258 Z" ${c('Hamstrings')}/></g></svg><div class="body-label bl-shoulder">Shoulders</div><div class="body-label bl-chest">Chest</div><div class="body-label bl-back">Back</div><div class="body-label bl-arms">Arms</div><div class="body-label bl-core">Core</div><div class="body-label bl-glute">Glutes</div><div class="body-label bl-ham">Hamstrings</div><div class="body-label bl-quad">Quads</div></div><div class="body-legend"><span><i class="dot"></i>none</span><span><i class="dot low"></i>low</span><span><i class="dot med"></i>moderate</span><span><i class="dot high"></i>high</span></div>`}
function weeklyCounts(){let now=new Date(),start=new Date(now);start.setDate(now.getDate()-6);let arr=[];for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+i);let key=d.toISOString().slice(0,10),n=allSetLogs().filter(x=>x.date.slice(0,10)===key).length;arr.push({d,n})}return arr}
function monthly(){let now=new Date(),month=now.getMonth(),year=now.getFullYear(),sets=allSetLogs().filter(x=>{let d=new Date(x.date);return d.getMonth()===month&&d.getFullYear()===year}),days=new Set(sets.map(x=>x.date.slice(0,10))),weights=sets.filter(x=>x.weight!==''),muscle={};sets.forEach(x=>x.muscles?.forEach(m=>muscle[m]=(muscle[m]||0)+1));return {sets,days,weights,muscle}}
function statsView(){let s=stats(),top=Object.entries(s.muscle).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...Object.values(s.muscle)),exercises={};s.sets.forEach(x=>exercises[x.exercise]=(exercises[x.exercise]||0)+1);let main=Object.entries(exercises).sort((a,b)=>b[1]-a[1]).slice(0,7);let prs={};s.sets.forEach(x=>{if(x.weight!==''&&(!prs[x.exercise]||Number(x.weight)>Number(prs[x.exercise].weight)))prs[x.exercise]=x});let pr=Object.values(prs).sort((a,b)=>Number(b.weight)-Number(a.weight)).slice(0,7);let mc=monthly(),week=weeklyCounts(),weekMax=Math.max(1,...week.map(x=>x.n));let daysText=[...s.days].length;return `<div class="card hero"><div class="row"><div><div class="tiny">Progress dashboard</div><div class="workout-title">Statistics</div></div><span class="pill">${s.sets.length} sets logged</span></div><div class="stat-grid" style="margin-top:13px"><div class="stat"><div class="label">WORKOUT DAYS</div><b>${daysText}</b></div><div class="stat"><div class="label">EXERCISES</div><b>${Object.keys(exercises).length}</b></div><div class="stat"><div class="label">HIIT SESSIONS</div><b>${data.logs.filter(x=>x.type==='HIIT').length}</b></div><div class="stat"><div class="label">ZONE 2 SESSIONS</div><b>${data.logs.filter(x=>x.type==='Zone 2').length}</b></div></div></div>
<div class="section-title">Cardio</div><div class="card"><div class="report-row"><span>HIIT</span><b>${data.logs.filter(x=>x.type==='HIIT').reduce((a,x)=>a+Number(x.minutes||0),0)} min total</b></div><div class="report-row"><span>Zone 2</span><b>${data.logs.filter(x=>x.type==='Zone 2').reduce((a,x)=>a+Number(x.minutes||0),0)} min total</b></div></div>
<div class="section-title">Set count per muscle group</div><div class="card">${top.length?top.map(([m,n])=>`<div class="barrow"><span>${m}</span><div class="bar"><div class="fill" style="width:${n/max*100}%"></div></div><b>${n}</b></div>`).join(''):'<div class="empty">Log a few sets and this will fill in automatically.</div>'}</div>
<div class="section-title">Muscle distribution</div><div class="card"><div class="small">Current training emphasis</div>${bodyMap(s.muscle)}</div>
<div class="section-title">Weekly activity</div><div class="card"><div class="small">Last 7 days • darker = more logged sets</div><div class="week-labels" style="margin-top:11px">${week.map(x=>x.d.toLocaleDateString(undefined,{weekday:'narrow'})).join('').split('').map(x=>`<span>${x}</span>`).join('')}</div><div class="heat">${week.map(x=>`<div class="day ${x.n?('worked'+intensityFor(x.n,weekMax)):''}"><b>${x.n||''}</b><span>${x.d.getDate()}</span></div>`).join('')}</div></div>
<div class="section-title">Main exercises</div><div class="card">${main.length?main.map(([e,n])=>`<div class="report-row"><span>${e}</span><span class="pr-badge">${n} sets</span></div>`).join(''):'<div class="empty">No exercise history yet.</div>'}</div>
<div class="section-title">Leaderboard exercises</div><div class="card">${pr.length?`<table class="table"><thead><tr><th>Exercise</th><th>Best load</th><th>Reps</th></tr></thead><tbody>${pr.map(x=>`<tr><td>${x.exercise}</td><td><b>${x.weight} lb</b></td><td>${x.reps}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Log weighted sets to build your personal leaderboard.</div>'}</div>
<div class="section-title">Monthly report</div><div class="card"><div class="month-header"><div><div class="tiny">${new Date().toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div><div class="month-title">Your training snapshot</div></div><span class="pill">${mc.sets.length} sets</span></div><div class="stat-grid"><div class="stat"><div class="label">WORKOUT DAYS</div><b>${mc.days.size}</b></div><div class="stat"><div class="label">WEIGHTED SETS</div><b>${mc.weights.length}</b></div></div><div class="mini-bars">${week.map(x=>{let h=Math.max(4,Math.round(x.n/weekMax*72));return `<div class="mini-bar"><i style="height:${h}px"></i><span>${x.d.toLocaleDateString(undefined,{weekday:'narrow'})}</span></div>`}).join('')}</div><div class="report-list" style="margin-top:12px"><div class="report-row"><span>Most-trained muscle</span><b>${Object.entries(mc.muscle).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—'}</b></div><div class="report-row"><span>Most-used exercise</span><b>${main[0]?.[0]||'—'}</b></div><div class="report-row"><span>Total logged sets</span><b>${mc.sets.length}</b></div></div><p class="footer-note">Use this as a trend report—not a goal to maximize. The app is designed to help you see consistency and progression while leaving room for recovery.</p></div>`}
function historyView(){let rows=data.logs.filter(x=>x.exercise).slice().reverse().slice(0,50);return `<div class="card hero"><div class="row"><div><div class="tiny">Recent logs</div><div class="workout-title">History</div></div><button class="secondary" onclick="if(confirm('Clear all workout history?')){data.logs=[];save();render()}">Clear</button></div></div><div class="card">${rows.length?`<table class="table"><thead><tr><th>Date</th><th>Exercise</th><th>Load</th><th>Reps</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${new Date(x.date).toLocaleDateString()}</td><td>${x.exercise}</td><td>${x.weight?x.weight+' lb':'—'}</td><td>${x.reps}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No workout history yet.</div>'}</div><div class="section-title">Cardio history</div><div class="card">${data.logs.filter(x=>x.type==='HIIT'||x.type==='Zone 2').slice().reverse().slice(0,20).map(x=>`<div class="report-row"><span>${x.type}</span><span>${x.minutes} min • ${new Date(x.date).toLocaleDateString()}</span></div>`).join('')||'<div class="empty">No cardio logged yet.</div>'}</div><div class="section-title">Backup & data</div><div class="card"><div class="row"><div><b>Protect your workout history</b><div class="backup-label">Export a copy before major app updates or device changes.</div></div></div><div class="backup-actions" style="margin-top:12px"><button class="primary" onclick="exportBackup()">Export backup</button><label class="secondary" style="text-align:center;cursor:pointer">Import backup<input type="file" accept="application/json,.json" onchange="importBackup(this.files[0]);this.value=''" style="display:none"></label></div></div><div class="card footer-note">Your previous weight is pulled from the most recent logged set for that exercise, so you can see what you used last time before choosing today's load.</div>`}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;render()});render();restoreTimer();document.addEventListener('visibilitychange',()=>{if(!document.hidden){initAudio();restoreTimer()}});window.addEventListener('focus',()=>{initAudio();restoreTimer()});
</script></body></html>
